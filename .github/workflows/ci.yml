name: CI

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The main-and-develop ruleset requires a check named "checks" in every repository
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 3.10 es la versión más antigua en la que se han ejecutado los scripts (los .pyc versionados eran cpython-310)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - id: python
        run: find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 python -m py_compile
      # El segundo chequeo corre aunque falle el primero, para reportar todos los errores en una sola ejecución
      - if: ${{ !cancelled() }}
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
